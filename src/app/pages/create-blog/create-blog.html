<div class="form-container flex">

  <div class="form-card">

    <h1>Create Blog</h1>

    <input
      type="text"
      placeholder="Enter blog title"
      [(ngModel)]="title"
    >

    <textarea
      rows="6"
      placeholder="Enter blog description"
      [(ngModel)]="description"
    >
    </textarea>

    <button (click)="createBlog()">
      Create Blog
    </button>

  </div>



</div>
